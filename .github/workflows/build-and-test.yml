name: Build and Test

on:
  push:
    branches:
      - master
      - docs-tests-foundation
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDKs
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            6.0.x
            8.0.x
            10.0.x
            11.0.x

      - name: Restore
        run: dotnet restore Canducci.EntityFrameworkCore.Relationships.slnx

      - name: Build all target frameworks
        run: dotnet build Canducci.EntityFrameworkCore.Relationships/Canducci.EntityFrameworkCore.Relationships.csproj --configuration Release --no-restore

      - name: Run tests on EF Core 7
        run: dotnet test Canducci.EntityFrameworkCore.Relationships.Tests/Canducci.EntityFrameworkCore.Relationships.Tests.csproj --configuration Release --no-restore --framework net6.0

      - name: Run tests on EF Core 9
        run: dotnet test Canducci.EntityFrameworkCore.Relationships.Tests/Canducci.EntityFrameworkCore.Relationships.Tests.csproj --configuration Release --no-restore --framework net8.0

      - name: Run tests on EF Core 10
        run: dotnet test Canducci.EntityFrameworkCore.Relationships.Tests/Canducci.EntityFrameworkCore.Relationships.Tests.csproj --configuration Release --no-restore --framework net10.0

      - name: Run tests on EF Core 11
        run: dotnet test Canducci.EntityFrameworkCore.Relationships.Tests/Canducci.EntityFrameworkCore.Relationships.Tests.csproj --configuration Release --no-restore --framework net11.0

      - name: Pack NuGet package
        run: dotnet pack Canducci.EntityFrameworkCore.Relationships/Canducci.EntityFrameworkCore.Relationships.csproj --configuration Release --no-restore --output artifacts/packages

      - name: Verify NuGet package assets
        run: |
          PACKAGE=$(find artifacts/packages -name '*.nupkg' -print -quit)
          test -n "$PACKAGE"
          unzip -Z1 "$PACKAGE" | grep -Fx 'README.md'
          unzip -Z1 "$PACKAGE" | grep -Fx 'icon.png'
          unzip -Z1 "$PACKAGE" | grep -Fx 'LICENSE'
